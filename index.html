document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style=\"padding:6px 10px;text-align:right\">개수<\/div><div style=\"padding:6px 20px 6px 14px;text-align:right\">병변별 계약금액<\/div>\n<\/div>\n<sc-for list=\"{{ lesionRows }}\" as=\"l\" hint-placeholder-count=\"2\">\n<div style=\"display:grid;grid-template-columns:44px minmax(0,1fr) 70px 90px 60px 120px;border-bottom:1px solid #e3e6ea\">\n<div style=\"padding:8px 10px;text-align:center\">{{ l.no }}<\/div><div style=\"padding:6px 14px;font-weight:600;color:#111418\">{{ l.siteText }}<\/div><div style=\"padding:6px 14px;text-align:right\">{{ l.sizeText }}<\/div><div style=\"padding:6px 14px\">{{ l.tier }}<\/div><div style=\"padding:6px 10px;text-align:right\">1개<\/div><div style=\"padding:6px 20px 6px 14px;text-align:right\">{{ l.priceText }}<\/div>\n<\/div>\n<\/sc-for>\n<div style=\"border-bottom:1.2px solid #1c1f23\"><\/div>\n<\/div>\n<div style=\"margin-top:10px;background:#fcfcfc;border:1px solid #eaeeef;border-radius:8px;padding:var(--cp,12px 16px);display:flex;flex-direction:column;gap:var(--sg,6px);font-size:var(--tx,11px);line-height:var(--lh,1.55);letter-spacing:-0.017em;text-wrap:pretty;color:#2b2f34\">\n<div style=\"display:flex;flex-direction:column;gap:var(--bg,2px)\"><div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[흑자 치료 등록 및 가격 기준]<\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>흑자 치료는 병변 1개를 등록 및 가격 산정의 기본 단위로 하며, 등록 시 병변의 크기 및 개수를 확인하여 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">각 병변의 크기에 따라<\/span> 병변별 계약금액을 산정합니다.<\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>병변별 계약금액은 해당 병변에 대한 전체 금액으로, <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">부분 PICO 532 1회 및 부분 REVLITE SI 4회 치료를 포함<\/span>합니다.<\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;font-size:0.9em;color:#50565d\"><div>※<\/div><div>각 레이저 회차는 개별 시술권으로 분할 판매하지 아니하며, 계약금액을 총 5회로 균등 분할하여 회차별 금액으로 산정하지 않습니다.<\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:var(--bg,2px)\"><div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[이용기간]<\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>등록된 흑자 치료는 결제 완료일로부터 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">1년 이내에 진행<\/span>하여야 합니다.<\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:var(--bg,2px)\"><div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[환불 규정]<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 시술 시작 전 해지 시 환불금액은 아래 기준으로 산정합니다.<\/div><div style=\"margin:4px 0 0 11px;background:#ffffff;border:1px solid #e3e6ea;border-radius:6px;display:flex;flex-direction:column\"><div style=\"display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:7px 12px;align-items:baseline\"><div style=\"font-weight:700;color:#111418\">시술 시작 전<\/div><div style=\"font-variant-numeric:tabular-nums\">환불금액 = 실제 납부금액 − <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">위약금 10%<\/span><\/div><\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;font-size:0.9em;color:#50565d\"><div>※<\/div><div>위약금은 실제 납부 금액이 아닌 총 계약금액의 10%를 기준으로 산정합니다.<\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>시술이 시작된 병변은 해당 병변에 대한 치료가 시작된 것으로 보며, <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">해당 병변의 계약금액 전액을 이용금액으로 산정<\/span>합니다. <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">미이용 REVLITE SI 회차는 별도의 환불 단위로 산정하지 않습니다.<\/span><\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>여러 병변을 등록한 경우, 시술하지 않은 병변은 환불 정산 대상에 포함하며, 실제 납부금액에서 위약금 10%(총 계약금액 기준)와 이용금액을 공제한 금액을 최종 환불금액으로 산정합니다.<\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:var(--bg,2px)\"><div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[환불 방법]<\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>환불은 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">원 결제 수단<\/span>을 기준으로 처리함을 원칙으로 합니다.<\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;font-size:0.9em;color:#50565d\"><div>※<\/div><div>신용카드사 등 결제 대행기관의 사정에 따라 실제 환불 반영 시점은 다를 수 있습니다.<\/div><\/div><\/div>\n\n<\/div>\n<\/sc-if>\n<sc-if value=\"{{ notLesion }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:7px;border-top:1.2px solid #1c1f23;font-size:var(--tbl,11.5px);line-height:1.5;font-variant-numeric:tabular-nums\">\n<div style=\"padding:8px 14px 5px;font-weight:600;border-bottom:1px solid #d5d9de\">기본 시술<\/div>\n<div style=\"display:flex;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">\n<div style=\"width:132px;box-sizing:border-box;padding:6px 14px\">구분<\/div><div style=\"flex:1;min-width:0;padding:6px 14px\">기본 시술<\/div><div style=\"width:100px;box-sizing:border-box;padding:6px 14px;text-align:right;white-space:nowrap\">횟수<\/div><div style=\"width:150px;box-sizing:border-box;padding:6px 20px 6px 14px;text-align:right\"><sc-if value=\"{{ isManualProg }}\" hint-placeholder-val=\"{{ false }}\">환불용 1회 정상가<\/sc-if><sc-if value=\"{{ notManualProg }}\" hint-placeholder-val=\"{{ true }}\">1회 정상가<\/sc-if><\/div>\n<\/div>\n<sc-for list=\"{{ baseRows }}\" as=\"d\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;border-bottom:1px solid #e3e6ea\">\n<div style=\"width:132px;box-sizing:border-box;padding:6px 14px\">{{ d.kind }}<\/div><div style=\"flex:1;min-width:0;padding:6px 14px;text-wrap:pretty;white-space:pre-line\">{{ d.name }}<\/div><div style=\"width:100px;box-sizing:border-box;padding:6px 14px;text-align:right;white-space:nowrap\">{{ d.qtyText }}<\/div><div style=\"width:150px;box-sizing:border-box;padding:6px 20px 6px 14px;text-align:right\">{{ d.priceText }}<\/div>\n<\/div>\n<\/sc-for>\n<sc-if value=\"{{ hasSwap }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:2px;padding:5px 14px;border-bottom:1px solid #e3e6ea\"><sc-for list=\"{{ swapNotes }}\" as=\"w\" hint-placeholder-count=\"1\"><div>{{ w.text }}<\/div><\/sc-for><\/div><\/sc-if>\n<sc-if value=\"{{ hasExtra }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:8px 14px 5px;font-weight:600;border-bottom:1px solid #d5d9de\">서비스·추가<\/div>\n<div style=\"display:flex;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">\n<div style=\"width:132px;box-sizing:border-box;padding:6px 14px\">구분<\/div><div style=\"flex:1;min-width:0;padding:6px 14px\">서비스·추가<\/div><div style=\"width:100px;box-sizing:border-box;padding:6px 14px;text-align:right;white-space:nowrap\">제공 횟수<\/div><div style=\"width:150px;box-sizing:border-box;padding:6px 20px 6px 14px;text-align:right\">추가금<\/div>\n<\/div>\n<sc-for list=\"{{ extraRows }}\" as=\"d\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;border-bottom:1px solid #e3e6ea\">\n<div style=\"width:132px;box-sizing:border-box;padding:6px 14px\">{{ d.kind }}<\/div><div style=\"flex:1;min-width:0;padding:6px 14px;text-wrap:pretty;white-space:pre-line\">{{ d.name }}<\/div><div style=\"width:100px;box-sizing:border-box;padding:6px 14px;text-align:right;white-space:nowrap\">{{ d.qtyText }}<\/div><div style=\"width:150px;box-sizing:border-box;padding:6px 20px 6px 14px;text-align:right\">{{ d.feeText }}<\/div>\n<\/div>\n<\/sc-for>\n<\/sc-if>\n<sc-if value=\"{{ showSum }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;border-bottom:1.2px solid #1c1f23;font-weight:600\">\n<div style=\"flex:1;padding:9px 14px\">{{ sumLabel }}<\/div><div style=\"width:150px;box-sizing:border-box;padding:9px 20px 9px 14px;text-align:right\">{{ sumValue }}<\/div>\n<\/div><\/sc-if><sc-if value=\"{{ hideSum }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-bottom:1.2px solid #1c1f23\"><\/div><\/sc-if>\n<sc-if value=\"{{ capNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:6px 0 0;font-size:11px;color:#4a5158;line-height:1.55\">{{ capNoteText }}<\/div><\/sc-if>\n<\/div>\n<\/sc-if>\n\n            <sc-if value=\"{{ notBrief }}\" hint-placeholder-val=\"{{ true }}\"><sc-if value=\"{{ notLesion }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"margin-top:12px;font-size:12.5px;font-weight:600\">2. 약관<\/div>\n            <div style=\"margin-top:8px;background:#fcfcfc;border:1px solid #eaeeef;border-radius:8px;padding:var(--cp,12px 16px);display:flex;flex-direction:column;gap:var(--sg,6px);font-size:var(--tx,11px);line-height:var(--lh,1.55);letter-spacing:-0.017em;text-wrap:pretty;color:#2b2f34\">\n              <sc-if value=\"{{ isDeposit }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[예약금]<\/div>\n                  <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 예약금은 일정 확정을 위해 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">프로그램 총 결제금액의 10%({{ depText }})<\/span>로 책정되며, 완납 전 환자 사유로 취소하는 경우 <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">반환되지 않습니다<\/span>.<\/div>\n                  \n                <\/div>\n              <\/sc-if>\n              <div>\n                <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[이용기간]<\/div>\n<sc-if value=\"{{ isEvent }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 이벤트 프로그램의 유효기간은 첫 시술 시작일로부터 2개월 이내이며, 스킨부스터 이벤트는 3개월입니다.<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 첫 시술일 {{ evFirstText }} · 유효기간 만료일 <b style=\"font-weight:700;color:#111418\">{{ evExpiryText }}<\/b><\/div><\/sc-if><sc-if value=\"{{ notEvent }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 프로그램은 결제 완료일로부터 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">1년 이내<\/span>에 진행합니다.<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 이용기간이 경과한 후에는 잔여 횟수를 이용할 수 없으며, <b style=\"font-weight:700;color:#111418\">환불 정산 대상에서 제외<\/b>됩니다.<\/div><\/sc-if>\n                \n                <sc-if value=\"{{ isPrepaid }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 단, 프로그램 내용이 정해지지 않은 선결제권은 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">1년 기간을 적용하지 않습니다<\/span>.<\/div><\/sc-if>\n              <\/div>\n              <sc-if value=\"{{ svcNote }}\" hint-placeholder-val=\"{{ false }}\"><div><div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[서비스 및 관리 변경]<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 프로그램 진행 중 피부 상태 및 의료진 판단에 따라 {{ svcWhat }}이 서비스로 제공될 수 있으며, 제공 여부와 수량·범위는 치료 경과에 따라 달라질 수 있습니다.<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 관리 변경은 의료진이 권유하고 <b style=\"font-weight:700;color:#111418\">환자가 동의한 경우에만<\/b> 진행하며, 차액은 <b style=\"font-weight:700;color:#111418\">변경 시점의 남은 회차<\/b>를 기준으로 추가 결제합니다.<\/div><\/div><\/sc-if><div>\n                <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[양도·전환]<\/div>\n<sc-if value=\"{{ isEvent }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 이벤트 프로그램은 타인에게 양도 불가합니다.<\/div><\/sc-if><sc-if value=\"{{ notEvent }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 해당 프로그램은 환자와 의료진의 합의 하에 타인에게 양도할 수 있습니다.<\/div>\n                <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 다른 프로그램으로 전환을 원하는 경우, 잔여 횟수를 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">등록 당시 1회 정상가<\/span> 기준 금액으로 환산하여 전환할 수 있습니다.<\/div><\/sc-if>\n              <\/div>\n              <div>\n                <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[환불 규정]<\/div>\n                <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 해지 시 환불금액은 아래 기준으로 산정합니다.<\/div><div style=\"margin:4px 0 0 11px;background:#ffffff;border:1px solid #e3e6ea;border-radius:6px;display:flex;flex-direction:column\"><div style=\"display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:7px 12px;align-items:baseline\"><div style=\"font-weight:700;color:#111418\">시술 시작 전<\/div><div style=\"font-variant-numeric:tabular-nums\">환불금액 = 실제 납부금액 − <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">위약금 10%<\/span><\/div><\/div><div style=\"display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:7px 12px;border-top:1px dashed #e3e6ea;align-items:baseline\"><div style=\"font-weight:700;color:#111418\">시술 시작 후<\/div><div style=\"font-variant-numeric:tabular-nums\">환불금액 = 실제 납부금액 − <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">위약금 10%<\/span> − <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">이용금액<\/span><\/div><\/div>\n                <\/div>\n                <div style=\"padding-left:11px;margin-top:5px;display:flex;flex-direction:column;gap:2px;font-size:0.9em;color:#50565d\">\n                  <div>※ 위약금은 예약금이나 현재까지 납부한 금액이 아닌, <b style=\"font-weight:700;color:#111418\">프로그램 총 결제금액의 10%<\/b>로 산정합니다.<\/div>\n                  <sc-if value=\"{{ noSvcNote }}\" hint-placeholder-val=\"{{ true }}\"><div>※ 이용금액은 <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">실제 이용한 시술<\/span>과 <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">프로그램(시술) 결제 시 발생되는 서비스<\/span>의 이용 수량·범위에 따라 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">등록 당시 1회 정상가<\/span>를 기준으로 계산합니다.<\/div><\/sc-if><sc-if value=\"{{ svcNote }}\" hint-placeholder-val=\"{{ false }}\"><div>※ 관리 변경으로 추가 결제한 금액은 <b style=\"font-weight:700;color:#111418\">아직 이용하지 않은 회차<\/b>에 해당하는 금액을 환불합니다.<\/div><\/sc-if>\n                  <div>※ 계산 결과가 0원 이하인 경우 추가 금액은 청구하지 않습니다.<\/div>\n                  \n                <\/div>\n              <\/div>\n              <div>\n                <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[환불 방법]<\/div>\n                <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 환불은 원 결제 수단으로 처리하며, 카드 결제는 원 결제 거래를 취소하는 방식으로 진행합니다.<\/div><div style=\"padding-left:11px;font-size:0.9em;color:#50565d\">※ 신용카드사 등 결제 대행기관의 사정에 따라 실제 환불 반영 시점은 다를 수 있습니다.<\/div>\n                \n              <\/div>\n              \n              \n              \n              \n              \n              \n              \n              \n            <\/div>\n            <\/sc-if><\/sc-if><sc-if value=\"{{ isBrief }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:12px;font-size:12.5px;font-weight:600\">2. 약관 (재등록 요약)<\/div>\n<div style=\"margin-top:8px;background:#fcfcfc;border:1px solid #eaeeef;border-radius:8px;padding:var(--cp,12px 16px);display:flex;flex-direction:column;gap:var(--sg,6px);font-size:var(--tx,11px);line-height:1.7;color:#2b3036\">\n<div>• <b style=\"font-weight:700;color:#111418\">이용기간<\/b> — 결제일로부터 1년 이내 (만료일 {{ expiryText }}). 기간이 지나면 잔여 회차는 환불 정산 대상에서 제외됩니다.<\/div>\n<div>• <b style=\"font-weight:700;color:#111418\">환불<\/b> — 시술 시작 전에는 총 결제금액의 10%를 위약금으로 공제합니다. 시작 후에는 위약금과 함께, 이용한 시술·서비스를 등록 당시 1회 정상가로 차감한 뒤 환불합니다.<\/div>\n<div>• <b style=\"font-weight:700;color:#111418\">서비스<\/b> — 프로그램 결제 시 제공되는 서비스(약처방·주사 등)는 무상 제공이며, 환불 시 이미 사용한 서비스는 정가로 정산합니다. 관리 변경은 환자가 동의한 경우에만 진행합니다.<\/div>\n<div>• <b style=\"font-weight:700;color:#111418\">양도·전환<\/b> — 의료진과 합의한 경우에만 가능합니다.<\/div>\n<div style=\"margin-top:4px;padding-top:6px;border-top:1px solid #eaeeef\">본인은 <b style=\"font-weight:700;color:#111418\">{{ briefPriorDate }}<\/b> 서명한 프로그램 이용 동의서의 약관 전문과 동일한 조건으로 본 프로그램을 등록하는 것에 동의합니다.<\/div>\n<\/div><\/sc-if><div style=\"margin-top:auto;padding-top:12px\"><div style=\"border-top:1px solid #d5d9de;padding-top:6px;display:flex;justify-content:center\"><div sc-camel-on-click=\"{{ toggleCkRefund }}\" style=\"min-height:32px;display:flex;align-items:center;gap:10px;cursor:pointer;color:#1f2226;font-size:var(--tx,12px)\"><div style=\"width:18px;height:18px;flex:none;box-sizing:border-box;border:1.5px solid {{ ckBd }};background:{{ ckBg }};border-radius:8px;display:flex;align-items:center;justify-content:center\"><sc-if value=\"{{ ckRefund }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffffff\" sc-camel-stroke-width=\"3.4\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\/path><\/svg><\/sc-if><\/div><div>위 <b style=\"font-weight:700\">환불 규정<\/b>을 확인하였습니다. <span style=\"color:#b4483f\">(필수)<\/span><\/div><\/div><\/div><\/div><div style=\"margin-top:6px;font-size:var(--tbl,11.5px);line-height:1.7;text-align:center\">본인은 위 내용에 대해 충분히 설명을 듣고 이해하였으며, 이에 동의합니다.<\/div>\n            <div style=\"margin-top:14px;display:flex;justify-content:center;align-items:flex-end;gap:18px;font-size:11.5px\">\n              <div>{{ docDateKo }}<\/div>\n              <div>환자 성명 <span style=\"display:inline-block;width:96px;border-bottom:1px solid #1c1f23;text-align:center\">{{ pName }}<\/span><\/div>\n              <div>서명 <span style=\"display:inline-block;width:116px;border-bottom:1px solid #1c1f23\">&nbsp;<\/span><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n        <\/div>\n      <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{ showSel }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width:100%;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px\">\n        <sc-if value=\"{{ noSel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:28px 16px;text-align:center;font-size:13.5px;color:#8d949b;border:1px dashed #d5d9de;border-radius:12px\">왼쪽에서 프로그램을 선택해 주세요<\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ hasSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:none;border:1px solid #e9ebee;border-radius:12px;overflow:hidden;background:#ffffff;padding-bottom:8px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;padding:14px 16px 12px;border-bottom:1px solid #eef0f2\">\n            <div style=\"flex:1;min-width:0;font-size:15px;font-weight:700;text-wrap:pretty\">{{ progName }}<\/div>\n            <div style=\"flex:none;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums\">{{ selPrice }}<\/div>\n          <\/div>\n          <sc-if value=\"{{ hasBaseSel }}\" hint-placeholder-val=\"{{ true }}\">\n          <d ion-break:clone;box-decoration-break:clone;color:#1f2226\">각 병변의 크기에 따라<\/span> 병변별 계약금액을 산정합니다.<\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>병변별 계약금액은 해당 병변에 대한 전체 금액으로, <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">부분 PICO 532 1회 및 부분 REVLITE SI 4회 치료를 포함<\/span>합니다.<\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;font-size:0.9em;color:#50565d\"><div>※<\/div><div>각 레이저 회차는 개별 시술권으로 분할 판매하지 아니하며, 계약금액을 총 5회로 균등 분할하여 회차별 금액으로 산정하지 않습니다.<\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:var(--bg,2px)\"><div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[이용기간]<\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>등록된 흑자 치료는 결제 완료일로부터 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">1년 이내에 진행<\/span>하여야 합니다.<\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:var(--bg,2px)\"><div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[환불 규정]<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 시술 시작 전 해지 시 환불금액은 아래 기준으로 산정합니다.<\/div><div style=\"margin:4px 0 0 11px;background:#ffffff;border:1px solid #e3e6ea;border-radius:6px;display:flex;flex-direction:column\"><div style=\"display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:7px 12px;align-items:baseline\"><div style=\"font-weight:700;color:#111418\">시술 시작 전<\/div><div style=\"font-variant-numeric:tabular-nums\">환불금액 = 실제 납부금액 − <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">위약금 10%<\/span><\/div><\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;font-size:0.9em;color:#50565d\"><div>※<\/div><div>위약금은 실제 납부 금액이 아닌 총 계약금액의 10%를 기준으로 산정합니다.<\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>시술이 시작된 병변은 해당 병변에 대한 치료가 시작된 것으로 보며, <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">해당 병변의 계약금액 전액을 이용금액으로 산정<\/span>합니다. <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">미이용 REVLITE SI 회차는 별도의 환불 단위로 산정하지 않습니다.<\/span><\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>여러 병변을 등록한 경우, 시술하지 않은 병변은 환불 정산 대상에 포함하며, 실제 납부금액에서 위약금 10%(총 계약금액 기준)와 이용금액을 공제한 금액을 최종 환불금액으로 산정합니다.<\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:var(--bg,2px)\"><div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[환불 방법]<\/div><div style=\"padding-left:11px;display:flex;gap:5px;margin-top:var(--bg,0px)\"><div>•<\/div><div>환불은 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">원 결제 수단<\/span>을 기준으로 처리함을 원칙으로 합니다.<\/div><\/div><div style=\"padding-left:11px;display:flex;gap:5px;font-size:0.9em;color:#50565d\"><div>※<\/div><div>신용카드사 등 결제 대행기관의 사정에 따라 실제 환불 반영 시점은 다를 수 있습니다.<\/div><\/div><\/div>\n\n<\/div>\n<\/sc-if>\n<sc-if value=\"{{ notLesion }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:7px;border-top:1.2px solid #1c1f23;font-size:var(--tbl,11.5px);line-height:1.5;font-variant-numeric:tabular-nums\">\n<div style=\"padding:8px 14px 5px;font-weight:600;border-bottom:1px solid #d5d9de\">기본 시술<\/div>\n<div style=\"display:flex;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">\n<div style=\"width:132px;box-sizing:border-box;padding:6px 14px\">구분<\/div><div style=\"flex:1;min-width:0;padding:6px 14px\">기본 시술<\/div><div style=\"width:100px;box-sizing:border-box;padding:6px 14px;text-align:right;white-space:nowrap\">횟수<\/div><div style=\"width:150px;box-sizing:border-box;padding:6px 20px 6px 14px;text-align:right\"><sc-if value=\"{{ isManualProg }}\" hint-placeholder-val=\"{{ false }}\">환불용 1회 정상가<\/sc-if><sc-if value=\"{{ notManualProg }}\" hint-placeholder-val=\"{{ true }}\">1회 정상가<\/sc-if><\/div>\n<\/div>\n<sc-for list=\"{{ baseRows }}\" as=\"d\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;border-bottom:1px solid #e3e6ea\">\n<div style=\"width:132px;box-sizing:border-box;padding:6px 14px\">{{ d.kind }}<\/div><div style=\"flex:1;min-width:0;padding:6px 14px;text-wrap:pretty;white-space:pre-line\">{{ d.name }}<\/div><div style=\"width:100px;box-sizing:border-box;padding:6px 14px;text-align:right;white-space:nowrap\">{{ d.qtyText }}<\/div><div style=\"width:150px;box-sizing:border-box;padding:6px 20px 6px 14px;text-align:right\">{{ d.priceText }}<\/div>\n<\/div>\n<\/sc-for>\n<sc-if value=\"{{ hasSwap }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:2px;padding:5px 14px;border-bottom:1px solid #e3e6ea\"><sc-for list=\"{{ swapNotes }}\" as=\"w\" hint-placeholder-count=\"1\"><div>{{ w.text }}<\/div><\/sc-for><\/div><\/sc-if>\n<sc-if value=\"{{ hasExtra }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:8px 14px 5px;font-weight:600;border-bottom:1px solid #d5d9de\">서비스·추가<\/div>\n<div style=\"display:flex;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">\n<div style=\"width:132px;box-sizing:border-box;padding:6px 14px\">구분<\/div><div style=\"flex:1;min-width:0;padding:6px 14px\">서비스·추가<\/div><div style=\"width:100px;box-sizing:border-box;padding:6px 14px;text-align:right;white-space:nowrap\">제공 횟수<\/div><div style=\"width:150px;box-sizing:border-box;padding:6px 20px 6px 14px;text-align:right\">추가금<\/div>\n<\/div>\n<sc-for list=\"{{ extraRows }}\" as=\"d\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;border-bottom:1px solid #e3e6ea\">\n<div style=\"width:132px;box-sizing:border-box;padding:6px 14px\">{{ d.kind }}<\/div><div style=\"flex:1;min-width:0;padding:6px 14px;text-wrap:pretty;white-space:pre-line\">{{ d.name }}<\/div><div style=\"width:100px;box-sizing:border-box;padding:6px 14px;text-align:right;white-space:nowrap\">{{ d.qtyText }}<\/div><div style=\"width:150px;box-sizing:border-box;padding:6px 20px 6px 14px;text-align:right\">{{ d.feeText }}<\/div>\n<\/div>\n<\/sc-for>\n<\/sc-if>\n<sc-if value=\"{{ showSum }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;border-bottom:1.2px solid #1c1f23;font-weight:600\">\n<div style=\"flex:1;padding:9px 14px\">{{ sumLabel }}<\/div><div style=\"width:150px;box-sizing:border-box;padding:9px 20px 9px 14px;text-align:right\">{{ sumValue }}<\/div>\n<\/div><\/sc-if><sc-if value=\"{{ hideSum }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-bottom:1.2px solid #1c1f23\"><\/div><\/sc-if>\n<sc-if value=\"{{ capNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:6px 0 0;font-size:11px;color:#4a5158;line-height:1.55\">{{ capNoteText }}<\/div><\/sc-if>\n<\/div>\n<\/sc-if>\n\n          <sc-if value=\"{{ notBrief }}\" hint-placeholder-val=\"{{ true }}\"><sc-if value=\"{{ notLesion }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"margin-top:12px;font-size:12.5px;font-weight:600\">2. 약관<\/div>\n          <div style=\"margin-top:8px;background:#fcfcfc;border:1px solid #eaeeef;border-radius:8px;padding:var(--cp,12px 16px);display:flex;flex-direction:column;gap:var(--sg,6px);font-size:var(--tx,11px);line-height:var(--lh,1.55);letter-spacing:-0.017em;text-wrap:pretty;color:#2b2f34\">\n            <sc-if value=\"{{ isDeposit }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[예약금]<\/div>\n                <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 예약금은 일정 확정을 위해 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">프로그램 총 결제금액의 10%({{ depText }})<\/span>로 책정되며, 완납 전 환자 사유로 취소하는 경우 <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">반환되지 않습니다<\/span>.<\/div>\n                \n              <\/div>\n            <\/sc-if>\n            <div>\n              <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[이용기간]<\/div>\n<sc-if value=\"{{ isEvent }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 이벤트 프로그램의 유효기간은 첫 시술 시작일로부터 2개월 이내이며, 스킨부스터 이벤트는 3개월입니다.<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 첫 시술일 {{ evFirstText }} · 유효기간 만료일 <b style=\"font-weight:700;color:#111418\">{{ evExpiryText }}<\/b><\/div><\/sc-if><sc-if value=\"{{ notEvent }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 프로그램은 결제 완료일로부터 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">1년 이내<\/span>에 진행합니다.<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 이용기간이 경과한 후에는 잔여 횟수를 이용할 수 없으며, <b style=\"font-weight:700;color:#111418\">환불 정산 대상에서 제외<\/b>됩니다.<\/div><\/sc-if>\n              \n              <sc-if value=\"{{ isPrepaid }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 단, 프로그램 내용이 정해지지 않은 선결제권은 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">1년 기간을 적용하지 않습니다<\/span>.<\/div><\/sc-if>\n            <\/div>\n            <sc-if value=\"{{ svcNote }}\" hint-placeholder-val=\"{{ false }}\"><div><div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[서비스 및 관리 변경]<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 프로그램 진행 중 피부 상태 및 의료진 판단에 따라 {{ svcWhat }}이 서비스로 제공될 수 있으며, 제공 여부와 수량·범위는 치료 경과에 따라 달라질 수 있습니다.<\/div><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 관리 변경은 의료진이 권유하고 <b style=\"font-weight:700;color:#111418\">환자가 동의한 경우에만<\/b> 진행하며, 차액은 <b style=\"font-weight:700;color:#111418\">변경 시점의 남은 회차<\/b>를 기준으로 추가 결제합니다.<\/div><\/div><\/sc-if><div>\n              <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[양도·전환]<\/div>\n<sc-if value=\"{{ isEvent }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 이벤트 프로그램은 타인에게 양도 불가합니다.<\/div><\/sc-if><sc-if value=\"{{ notEvent }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 해당 프로그램은 환자와 의료진의 합의 하에 타인에게 양도할 수 있습니다.<\/div>\n              <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 다른 프로그램으로 전환을 원하는 경우, 잔여 횟수를 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">등록 당시 1회 정상가<\/span> 기준 금액으로 환산하여 전환할 수 있습니다.<\/div><\/sc-if>\n            <\/div>\n            <div>\n              <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[환불 규정]<\/div>\n              <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 해지 시 환불금액은 아래 기준으로 산정합니다.<\/div><div style=\"margin:4px 0 0 11px;background:#ffffff;border:1px solid #e3e6ea;border-radius:6px;display:flex;flex-direction:column\"><div style=\"display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:7px 12px;align-items:baseline\"><div style=\"font-weight:700;color:#111418\">시술 시작 전<\/div><div style=\"font-variant-numeric:tabular-nums\">환불금액 = 실제 납부금액 − <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">위약금 10%<\/span><\/div><\/div><div style=\"display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:7px 12px;border-top:1px dashed #e3e6ea;align-items:baseline\"><div style=\"font-weight:700;color:#111418\">시술 시작 후<\/div><div style=\"font-variant-numeric:tabular-nums\">환불금액 = 실제 납부금액 − <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">위약금 10%<\/span> − <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">이용금액<\/span><\/div><\/div>\n              <\/div>\n              <div style=\"padding-left:11px;margin-top:5px;display:flex;flex-direction:column;gap:2px;font-size:0.9em;color:#50565d\">\n                <div>※ 위약금은 예약금이나 현재까지 납부한 금액이 아닌, <b style=\"font-weight:700;color:#111418\">프로그램 총 결제금액의 10%<\/b>로 산정합니다.<\/div>\n                <sc-if value=\"{{ noSvcNote }}\" hint-placeholder-val=\"{{ true }}\"><div>※ 이용금액은 <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">실제 이용한 시술<\/span>과 <span style=\"background:linear-gradient(100deg, rgba(255,190,215,0) 0%, rgba(255,190,215,0.45) 2%, rgba(255,184,210,0.4) 50%, rgba(255,190,215,0.45) 97%, rgba(255,190,215,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">프로그램(시술) 결제 시 발생되는 서비스<\/span>의 이용 수량·범위에 따라 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">등록 당시 1회 정상가<\/span>를 기준으로 계산합니다.<\/div><\/sc-if><sc-if value=\"{{ svcNote }}\" hint-placeholder-val=\"{{ false }}\"><div>※ 관리 변경으로 추가 결제한 금액은 <b style=\"font-weight:700;color:#111418\">아직 이용하지 않은 회차<\/b>에 해당하는 금액을 환불합니다.<\/div><\/sc-if>\n                <div>※ 계산 결과가 0원 이하인 경우 추가 금액은 청구하지 않습니다.<\/div>\n                \n              <\/div>\n            <\/div>\n            <div>\n              <div style=\"font-weight:700;font-size:var(--tt,12px);color:#111418;margin-bottom:var(--tb,1px)\">[환불 방법]<\/div>\n              <div style=\"padding-left:11px;margin-top:var(--bg,0px)\">• 환불은 원 결제 수단으로 처리하며, 카드 결제는 원 결제 거래를 취소하는 방식으로 진행합니다.<\/div><div style=\"padding-left:11px;font-size:0.9em;color:#50565d\">※ 신용카드사 등 결제 대행기관의 사정에 따라 실제 환불 반영 시점은 다를 수 있습니다.<\/div>\n              \n            <\/div>\n            \n            \n            \n            \n            \n            \n            \n            \n          <\/div>\n          <\/sc-if><\/sc-if><sc-if value=\"{{ isBrief }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:12px;font-size:12.5px;font-weight:600\">2. 약관 (재등록 요약)<\/div>\n<div style=\"margin-top:8px;background:#fcfcfc;border:1px solid #eaeeef;border-radius:8px;padding:var(--cp,12px 16px);display:flex;flex-direction:column;gap:var(--sg,6px);font-size:var(--tx,11px);line-height:1.7;color:#2b3036\">\n<div>• <b style=\"font-weight:700;color:#111418\">이용기간<\/b> — 결제일로부터 1년 이내 (만료일 {{ expiryText }}). 기간이 지나면 잔여 회차는 환불 정산 대상에서 제외됩니다.<\/div>\n<div>• <b style=\"font-weight:700;color:#111418\">환불<\/b> — 시술 시작 전에는 총 결제금액의 10%를 위약금으로 공제합니다. 시작 후에는 위약금과 함께, 이용한 시술·서비스를 등록 당시 1회 정상가로 차감한 뒤 환불합니다.<\/div>\n<div>• <b style=\"font-weight:700;color:#111418\">서비스<\/b> — 프로그램 결제 시 제공되는 서비스(약처방·주사 등)는 무상 제공이며, 환불 시 이미 사용한 서비스는 정가로 정산합니다. 관리 변경은 환자가 동의한 경우에만 진행합니다.<\/div>\n<div>• <b style=\"font-weight:700;color:#111418\">양도·전환<\/b> — 의료진과 합의한 경우에만 가능합니다.<\/div>\n<div style=\"margin-top:4px;padding-top:6px;border-top:1px solid #eaeeef\">본인은 <b style=\"font-weight:700;color:#111418\">{{ briefPriorDate }}<\/b> 서명한 프로그램 이용 동의서의 약관 전문과 동일한 조건으로 본 프로그램을 등록하는 것에 동의합니다.<\/div>\n<\/div><\/sc-if><div style=\"margin-top:auto;padding-top:12px\"><div style=\"border-top:1px solid #d5d9de;padding-top:6px;display:flex;justify-content:center\"><div sc-camel-on-click=\"{{ toggleCkRefund }}\" style=\"min-height:32px;display:flex;align-items:center;gap:10px;cursor:pointer;color:#1f2226;font-size:var(--tx,12px)\"><div style=\"width:18px;height:18px;flex:none;box-sizing:border-box;border:1.5px solid {{ ckBd }};background:{{ ckBg }};border-radius:8px;display:flex;align-items:center;justify-content:center\"><sc-if value=\"{{ ckRefund }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffffff\" sc-camel-stroke-width=\"3.4\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\/path><\/svg><\/sc-if><\/div><div>위 <b style=\"font-weight:700\">환불 규정<\/b>을 확인하였습니다. <span style=\"color:#b4483f\">(필수)<\/span><\/div><\/div><\/div><\/div><div style=\"margin-top:6px;font-size:var(--tbl,11.5px);line-height:1.7;text-align:center\">본인은 위 내용에 대해 충분히 설명을 듣고 이해하였으며, 이에 동의합니다.<\/div>\n          <div style=\"margin-top:14px;display:flex;justify-content:center;align-items:flex-end;gap:18px;font-size:11.5px\">\n            <div>{{ docDateKo }}<\/div>\n            <div>환자 성명 <span style=\"display:inline-block;width:96px;border-bottom:1px solid #1c1f23;text-align:center\">{{ pName }}<\/span><\/div>\n            <div sc-camel-on-click=\"{{ openSigPad }}\" style=\"cursor:pointer\">서명 <span style=\"display:inline-block;width:116px;height:26px;border-bottom:1px solid #1c1f23;position:relative;vertical-align:bottom\">\n              <sc-if value=\"{{ hasSigImg }}\" hint-placeholder-val=\"{{ false }}\">\n                {{ sigEl }}\n              <\/sc-if>\n              <sc-if value=\"{{ noSigImg }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:9.5px;color:#9aa0a7;font-family:Pretendard,sans-serif\">터치하여 서명<\/span>\n              <\/sc-if>\n            <\/span><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div sc-camel-on-click=\"{{ exitSign }}\" style=\"position:absolute;left:14px;bottom:14px;width:34px;height:34px;border-radius:17px;background:rgba(28,31,35,.06);display:flex;align-items:center;justify-content:center;font-size:11px;color:#9aa0a7;font-family:Pretendard,sans-serif;cursor:pointer\">직원<\/div>\n\n  <sc-if value=\"{{ sigOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(20,24,28,.46);display:flex;align-items:flex-end;justify-content:center;z-index:40\">\n      <div style=\"width:820px;background:#fff;border-radius:22px 22px 0 0;padding:20px 26px 26px;box-sizing:border-box;font-family:Pretendard,sans-serif;box-shadow:0 -6px 30px rgba(20,24,28,.18)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\">\n          <div style=\"font-size:17px;font-weight:700;letter-spacing:-0.01em\">환자 서명<\/div>\n          <div sc-camel-on-click=\"{{ clearSig }}\" style=\"font-size:13px;color:#4a5158;padding:6px 14px;border:1px solid #d5d9de;border-radius:10px;cursor:pointer\">다시 쓰기<\/div>\n        <\/div>\n        <div style=\"width:768px;height:230px;border:1.5px dashed #c9ced4;border-radius:12px;background:#fff;position:relative\">\n          <canvas ref=\"{{ sigRef }}\" width=\"768\" height=\"230\" sc-camel-on-pointer-down=\"{{ sigDown }}\" sc-camel-on-pointer-move=\"{{ sigMove }}\" sc-camel-on-pointer-up=\"{{ sigUp }}\" style=\"width:768px;height:230px;display:block;border-radius:12px;cursor:crosshair;touch-action:none\"><\/canvas>\n          <sc-if value=\"{{ noSig }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:15px;color:#b6bcc2\">여기에 서명해 주세요<\/div>\n          <\/sc-if>\n        <\/div>\n        <div style=\"margin-top:16px;display:flex;align-items:center;gap:12px\">\n          <div style=\"flex:1\"><\/div>\n          <div sc-camel-on-click=\"{{ closeSigPad }}\" style=\"height:52px;padding:0 22px;border-radius:8px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#345b80;background:transparent;cursor:pointer\">취소<\/div>\n          <div sc-camel-on-click=\"{{ confirmSigPad }}\" style=\"height:52px;padding:0 30px;border-radius:8px;display:flex;align-items:center;font-size:15.5px;font-weight:700;cursor:pointer;background:{{ okBg }};color:{{ okFg }}\">서명 완료<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{ hasSigImg }}\" hint-p 0px\">\n        <div style=\"font-size:13px;font-weight:600;color:#345b80\">결제수단별 환불<\/div>\n        <sc-for list=\"{{ rfPayRows }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid #e3e8ee;border-radius:8px;background:#ffffff\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px\">\n              <span style=\"font-weight:600;white-space:nowrap\">{{ p.method }}<\/span>\n              <span style=\"font-size:12.5px;color:#6d747c;font-variant-numeric:tabular-nums;white-space:nowrap\">원결제 {{ p.paid }}<\/span>\n            <\/div>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-size:12.5px;color:#6d747c;flex:none\">환불<\/span>\n              <input type=\"text\" sc-camel-input-mode=\"numeric\" placeholder=\"0\" value=\"{{ p.val }}\" sc-camel-on-input=\"{{ p.onVal }}\" style=\"flex:1;min-width:0;height:40px;box-sizing:border-box;border:1px solid {{ p.bd }};border-radius:8px;padding:0 10px;font-family:inherit;text-align:right;background:#ffffff;font-variant-numeric:tabular-nums\">\n              <span style=\"font-size:12.5px;color:#6d747c;flex:none\">원<\/span>\n            <\/div>\n            <div style=\"font-size:12px;color:#6d747c;text-align:right;font-variant-numeric:tabular-nums\">남은 금액 {{ p.left }}<\/div>\n            <sc-if value=\"{{ p.err }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#d64545;text-align:right\">{{ p.errText }}<\/div><\/sc-if>\n          <\/div>\n        <\/sc-for>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px dashed #d9e2ea;font-size:13.5px\">\n          <span style=\"font-size:12.5px;color:{{ rfAllocFg }}\">{{ rfAllocMsg }}<\/span>\n          <span style=\"font-weight:600;font-variant-numeric:tabular-nums\">환불 합계 {{ rfAllocSum }}<\/span>\n        <\/div>\n      <\/div><\/sc-if>\n    <\/div>\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<!-- ================= 정산서 서명 ================= -->\n<sc-if value=\"{{ isRefundSign }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"position:fixed;top:0;left:0;width:820px;height:100vh;height:100dvh;background:#ffffff;overflow:hidden;z-index:20\">\n  <div style=\"position:absolute;inset:0;overflow:hidden;background:#fff\">\n    <div style=\"width:100%;height:100%;box-sizing:border-box;padding-bottom:100px;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:#fff\">\n      <div style=\"width:820px;overflow:hidden\">\n      <div ref=\"{{ sgRef }}\" style=\"width:740px;transform:translateZ(0) scale(1.1081);transform-origin:top left;will-change:transform;backface-visibility:hidden;margin-bottom:{{ sgMb }}px\">\n        <div style=\"width:740px;max-width:740px;overflow:hidden;min-height:0px;padding:24px 34px;box-sizing:border-box;display:flex;flex-direction:column;--lh:1.72;--sg:11px;--bg:4px;--tt:14px;--tb:4px;--cp:16px 20px;word-break:keep-all;overflow-wrap:break-word;font-family:'Noto Serif KR',serif;color:#1c1f23\">\n          <div style=\"text-align:center;font-size:23px;font-weight:600;letter-spacing:0.06em\">환불 정산서<\/div>\n          <div style=\"text-align:center;font-size:11.5px;color:#7b828a;margin-top:7px;font-family:Pretendard,sans-serif\">다채움피부과의원 · 정산일 {{ rfToday }}<\/div>\n          <div style=\"height:1.5px;background:#1c1f23;margin:9px 0 10px\"><\/div>\n          <div style=\"display:grid;grid-template-columns:132px 1fr 132px 1fr;border-top:1px solid #d5d9de;font-size:var(--tbl,11.5px);line-height:1.5;white-space:nowrap\">\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">성명<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfName }}<\/div>\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">생년월일<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfBirth }}<\/div>\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">연락처<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfPhone }}<\/div>\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">결제수단<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfMethod }}<\/div>\n          <\/div>\n          <div style=\"margin-top:13px;font-size:12px;font-weight:600\">1. 원 동의서 내용<\/div>\n          <div style=\"margin-top:7px;display:grid;grid-template-columns:132px 1fr 132px 1fr;border-top:1px solid #d5d9de;font-size:11.5px;line-height:1.5\">\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">프로그램명<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de;grid-column:span 3;text-wrap:pretty\">{{ rfProg }}<\/div>\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">등록일<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfDate }}<\/div>\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">이용기간 만료일<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfExpiry }}<\/div>\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">총 결제금액<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfTotal }}원<\/div>\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">납부금액<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfPaid }}원 ({{ rfPayState }})<\/div>\n<sc-if value=\"{{ hasRfPrepaid }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">선결제권 사용분<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de;grid-column:span 3\">{{ rfPrepaidUse }} (납부금액에 포함)<\/div><\/sc-if>\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">해지 구분<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfStage }}<\/div>\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">환불 사유<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #d5d9de\">{{ rfReason }}<\/div>\n          <\/div>\n          <div style=\"margin-top:7px;font-size:10.5px;color:#7b828a;font-family:Pretendard,sans-serif\">※ <span style=\"background:#fdf3b5;padding:1px 3px;color:#2b2f34\">등록 당시 금액 및 규정<\/span>을 기준으로 정산하며, <b style=\"font-weight:700;color:#111418\">이후의 가격 변경과 무관합니다<\/b>.<\/div>\n          <div style=\"margin-top:16px;font-size:12px;font-weight:600\">2. 이용내역 (공제 근거)<\/div>\n          <div style=\"margin-top:7px;display:grid;grid-template-columns:132px 1fr 58px 58px 92px 100px;border-top:1.2px solid #1c1f23;font-size:var(--tbl,11.5px);line-height:1.5;font-variant-numeric:tabular-nums\">\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">구분<\/div><div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">항목<\/div><div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500;text-align:right\">등록<\/div><div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500;text-align:right\">진행<\/div><div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500;text-align:right\">1회 정상가<\/div><div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500;text-align:right\">차감금액<\/div>\n            <sc-for list=\"{{ rDocRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea\">{{ r.kind }}<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-wrap:pretty\">{{ r.name }}<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-align:right\">{{ r.reg }}<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-align:right\">{{ r.used }}<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-align:right\">{{ r.price }}<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-align:right\">{{ r.amt }}<\/div>\n            <\/sc-for>\n            <div style=\"padding:7px 14px;border-bottom:1.2px solid #1c1f23;grid-column:span 5;font-weight:600\">이용금액 합계<\/div><div style=\"padding:7px 14px;border-bottom:1.2px solid #1c1f23;text-align:right;font-weight:600\">{{ rfUsedAmt }}<\/div>\n          <\/div>\n          <sc-if value=\"{{ hasCap }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:6px;font-size:10.4px;color:#5c636b;font-family:Pretendard,sans-serif\">{{ rfCapNote }}<\/div><\/sc-if>\n          <div style=\"margin-top:16px;font-size:12px;font-weight:600\">3. 정산 계산<\/div>\n          <div style=\"margin-top:7px;display:grid;grid-template-columns:1fr 130px;border-top:1.2px solid #1c1f23;font-size:11.5px\">\n            <div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea\">납부금액<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-align:right\">{{ rfPaid }}원<\/div>\n            <div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea\">− 위약금 (총 계약금액 {{ rfTotal }}원 × 10%)<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-align:right\">{{ rfPen }}원<\/div>\n            <div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea\">− 이용금액 ({{ rfUsedBreak }})<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-align:right\">{{ rfUsedAmt }}원<\/div>\n            <div style=\"padding:9px 14px;border-bottom:1.2px solid #1c1f23;font-weight:600\">= 최종 환불금액<\/div><div style=\"padding:9px 14px;border-bottom:1.2px solid #1c1f23;text-align:right;font-weight:600\"><span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">{{ rfRefund }}원<\/span><\/div>\n          <\/div>\n          <div style=\"margin-top:16px;font-size:12px;font-weight:600\">4. 환불 방법<\/div>\n          <div style=\"margin-top:7px;display:grid;grid-template-columns:1fr 130px 130px;border-top:1.2px solid #1c1f23;font-size:11.5px;font-variant-numeric:tabular-nums\">\n            <div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500\">결제수단<\/div><div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500;text-align:right\">원결제·사용액<\/div><div style=\"padding:6px 14px;background:#f7f8f9;border-bottom:1px solid #d5d9de;font-weight:500;text-align:right\">반환·복원액<\/div>\n            <sc-for list=\"{{ rfMethodRows }}\" as=\"mr\" hint-placeholder-count=\"2\">\n            <div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea\">{{ mr.method }}<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-align:right\">{{ mr.paid }}<\/div><div style=\"padding:6px 14px;border-bottom:1px solid #e3e6ea;text-align:right\">{{ mr.refund }}<\/div>\n            <\/sc-for>\n            <div style=\"padding:7px 14px;border-bottom:1.2px solid #1c1f23;grid-column:span 2;font-weight:600\">합계 (= 최종 환불금액)<\/div><div style=\"padding:7px 14px;border-bottom:1.2px solid #1c1f23;text-align:right;font-weight:600\">{{ rfMethodSum }}<\/div>\n          <\/div>\n          <div style=\"margin-top:16px;font-size:12px;font-weight:600\">5. 확인 사항<\/div>\n          <div style=\"margin-top:7px;display:flex;flex-direction:column;gap:9px;font-size:10.4px;line-height:1.6;letter-spacing:-0.017em;text-wrap:pretty;color:#2b2f34\">\n            <div>· 위약금은 납부액이 아닌 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">총 결제금액의 10%<\/span>, 이용금액은 <b style=\"font-weight:700;color:#111418\">실제 이용한 수량·범위·기간<\/b>에 따라 <span style=\"background:linear-gradient(100deg, rgba(255,236,120,0) 0%, rgba(255,236,120,0.55) 2%, rgba(255,232,110,0.5) 50%, rgba(255,236,120,0.55) 97%, rgba(255,236,120,0) 100%) 0 62% / 100% 68% no-repeat;padding:0 2px;margin:0 -1px;border-radius:2px 5px 3px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1f2226\">등록 당시 정상가<\/span> 기준으로 산정되었습니다.<\/div>\n            <div>· 계산 결과가 0원 이하인 경우 <b style=\"font-weight:700;color:#111418\">추가 금액은 청구하지 않습니다<\/b>.<\/div>\n            <div>· 환불은 <b style=\"font-weight:700;color:#111418\">원결제 수단<\/b>을 기준으로 처리하며, 카드 결제의 경우 원결제 거래 기준으로 취소합니다. 환불 반영 시점은 카드사별로 다를 수 있습니다.<\/div>\n            <sc-if value=\"{{ hasRfPrepaid }}\" hint-placeholder-val=\"{{ false }}\"><div>· 선결제권 사용분의 환불액은 현금·카드로 돌려드리지 않고 <b style=\"font-weight:700;color:#111418\">선결제권 잔액으로 복원<\/b>합니다. 이 프로그램에 사용하지 않은 선결제권 잔액은 이 정산에 포함되지 않습니다.<\/div><\/sc-if>\n          <\/div>\n          <div style=\"margin-top:16px;font-size:11.5px;line-height:1.7\">본인은 위 정산 내역을 확인하였으며, 해당 금액으로 환불 정산에 동의합니다.<\/div>\n          <div style=\"margin-top:14px;display:flex;justify-content:center;align-items:flex-end;gap:18px;font-size:11.5px\">\n            <div>{{ rfTodayKo }}<\/div>\n            <div>환자 성명 <span style=\"display:inline-block;width:88px;border-
